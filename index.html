<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>등불탑 — 턴제 RPG</title>
<style>
:root{--bg:#14121c;--panel:#1f1b2b;--line:#3a3350;--text:#f1e9d8;--dim:#a99fba;--gold:#ffc657;--hp:#ff5d6c;--mp:#5fb4ff;--ok:#7be38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{display:flex;justify-content:center;min-height:100vh;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:520px;padding:10px 12px 24px}
h1{font-size:20px;margin:6px 0 2px;color:var(--gold);letter-spacing:1px}
.sub{color:var(--dim);font-size:13px;margin:0 0 10px}
#hud{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.bar{height:10px;background:#000a;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;transition:width .25s}
#stage{position:relative;width:100%;aspect-ratio:3/2;background:#0b0a10;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation}
#cv{width:100%;height:100%;display:block}
#msg{min-height:40px;font-size:14px;margin:8px 2px;color:var(--text);line-height:1.4}
#acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#acts.g2{grid-template-columns:repeat(2,1fr)}
button{font:inherit;font-size:15px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 6px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.main{background:#4a2f12;border-color:#a4702a;color:#ffe2a8;font-weight:700}
button.wide{grid-column:1/-1}
small.k{color:var(--dim);font-size:11px;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.6}
.panel b{color:var(--gold)}
.r1{color:#e6e6e6}.r2{color:#7be38a}.r3{color:#5fb4ff}.r4{color:#d28bff}
#hud .prow{display:flex;gap:6px;flex-basis:100%}
.chip.mem{flex:1;min-width:0;font-size:12px;padding:3px 6px}.chip.mem .num{color:var(--dim);font-size:11px}.chip.mem.ko{opacity:.45}.chip.mem.cur{border-color:#ffd257;box-shadow:0 0 0 1px #ffd257 inset}
.bar.thin{height:6px}
footer{margin-top:16px;color:var(--dim);font-size:12px;text-align:center}
footer a{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <h1>🏮 등불탑</h1>
  <p class="sub">꺼진 등불을 다시 켜며 탑을 오르는 턴제 RPG</p>
  <div id="hud"></div>
  <div id="stage"><canvas id="cv" width="600" height="400"></canvas></div>
  <div id="msg"></div>
  <div id="acts"></div>
  <div id="info"></div>
  <footer>저장은 이 브라우저에 자동으로 돼요 · PC: 숫자 1~9로 버튼 고르기, 스페이스/엔터는 첫 버튼 · 폰: 버튼 탭(적을 직접 탭해서 고를 수도 있어요)<br>
  <a href="archive/orgol/">지난 실험: 셀룰러 오르골</a></footer>
</div>
<script>
'use strict';
const W=600,H=400;
// ================= 데이터 =================
const SAVE_KEY='lanternTower.save';
const SAVE_VER=4;
const ENEMIES=[
  {id:'slime',name:'그을음 슬라임',hp:22,atk:6,def:0,exp:6,gold:5,col:'#5b5670',shape:'slime',fl:[1,5],ai:['atk','atk','grow'],weak:'fire'},
  {id:'bat',name:'촛농 박쥐',hp:16,atk:8,def:0,exp:7,gold:6,col:'#c9b48a',shape:'bat',fast:true,double:.5,fl:[2,7],ai:['atk','hide']},
  {id:'armor',name:'녹슨 빈 갑주',hp:34,atk:7,def:3,exp:9,gold:8,col:'#8a6a4f',shape:'armor',fl:[3,8],ai:['atk','shield','heavy']},
  {id:'wisp',name:'심지 도깨비불',hp:24,atk:9,def:1,exp:10,gold:9,col:'#7fd1ff',shape:'wisp',fast:true,feint:.6,fl:[4,9],ai:['atk','atk','heavy'],fireEat:1,weak:'water'},
  {id:'book',name:'날뛰는 마도서',hp:30,atk:9,def:1,exp:12,gold:11,col:'#8c3b2e',shape:'book',fast:true,feint:.45,double:.4,fl:[6,16],ai:['atk','cast'],weak:'fire'},
  {id:'ink',name:'먹물 그림자',hp:40,atk:10,def:2,exp:14,gold:12,col:'#3b3270',shape:'ink',fl:[7,20],ai:['heavy','atk'],weak:'fire'},
  {id:'bell',name:'금 간 종',hp:46,atk:10,def:3,exp:17,gold:14,col:'#9a7b3c',shape:'bell',double:.6,chainMax:2,fl:[11,99],ai:['atk','ring']},
  {id:'mirror',name:'서리 거울',hp:40,atk:12,def:2,exp:18,gold:15,col:'#9fd6e8',shape:'mirror',shell:1,feint:.35,fl:[11,99],ai:['atk','reflect','atk']},
];
const BOSSES=[
  {id:'keeper',name:'그림자 등지기',hp:80,atk:10,def:3,exp:40,gold:40,col:'#3d2f5c',shape:'boss',feint:.4,ai:['atk','heavy','hide','atk'],
    ai2:['summon','heavy','atk','hide'],p2msg:'그림자 등지기가 꺼진 등불을 삼켰다! 이제 <b>👥 그림자 졸개</b>를 불러낸다.'},
  {id:'sage',name:'침묵의 사서',hp:105,atk:12,def:3,exp:65,gold:65,col:'#4b3a2a',shape:'sage',feint:.5,double:.4,ai:['atk','cast','atk','cast'],weak:'fire',
    ai2:['silence','cast','atk','cast'],p2msg:'침묵의 사서가 책을 덮었다! 이제 <b>🤐 침묵의 장</b>으로 우리 기술을 봉인한다.'},
  {id:'moth',name:'잿빛 큰나방',hp:95,atk:12,def:2,exp:55,gold:55,col:'#8f8478',shape:'moth',fast:true,feint:.5,double:.45,chainMax:2,ai:['atk','hide','ring','atk'],weak:'fire',
    ai2:['cocoon','ring','atk','hide'],p2msg:'잿빛 큰나방이 비늘가루를 흩뿌린다! 이제 <b>🐛 고치</b>를 짓고 상처를 아물게 한다.'},
];

const SHADE={id:'shade',name:'그림자 졸개',hp:15,atk:6,def:0,exp:3,gold:2,col:'#2a2240',shape:'ink',ai:['atk']};
const CUTTABLE=['heavy','cast','summon','silence']; // 🔥일격·🔨강타로 끊을 수 있는 의도
// 적의 의도: 판마다 미리 보여 주고, 파티의 선택에 따라 결과가 달라진다
const INTENTS={

  hide:{ic:'🌑',n:'어둠에 숨음',d:'이번 판 물리 공격이 자주 빗나간다 (🔥불로 비추면 ×1.3)',c:'#9a90b8'},

  silence:{ic:'🤐',n:'침묵의 장',d:'다음 판 파티 기술 봉인! 먼저 🔥일격·🔨강타로 끊어라 (회복약·방어는 가능)',c:'#e0a0ff'},

    ['yeoul','다치면 제가 물로 고쳐 드릴게요. 대신… 무서운 건 앞에서 막아 주세요!']],
  bawi:[['bawi','그 그림자 등지기를 네가 쓰러뜨렸다고? 그 쬐끄만 등불로?'],['yeoul','저희 둘이 같이 했어요!'],
    ['bawi','하하! 좋아, 앞은 내가 막지. 대신 맛있는 거 생기면 나눠 먹는 거다.'],['hero','(든든한 방패가 생겼다. 더 높이 올라갈 수 있겠어.)']],
};
// 지역 이야기 한 컷: 각 지역 첫 층에 처음 들어설 때 한 번 (S.seenReg). speaker: narr(해설)/hero/yeoul/bawi — 아직 합류 안 한 동료의 줄은 건너뜀
const STORY=[
  [['narr','오래전, 등불탑 꼭대기의 큰등불이 꺼졌다. 그날부터 층마다 그림자가 자라났다.'],['hero','스승님은 떠나기 전에 "꼭대기에서 누가 기다린다"는 말만 남기셨지…'],['hero','좋아. 한 층씩 다시 켜면서 올라가 보자.']],
  [['narr','타다 만 책장 사이, 단 한 권만 멀쩡하게 펼쳐져 있다.'],['yeoul','"큰등불은 꺼진 것이 아니다. 누군가 그 빛을 위로 가져갔다"… 무슨 뜻일까요?'],
    ['bawi','빛 도둑이라도 있다는 거냐? 그럼 붙잡아서 돌려받으면 되지!'],['hero','(책 마지막 장에 등불 모양 표식… 스승님의 표식이다.)']],
  [['narr','금 간 종들 사이로, 아주 높은 곳에서 맑은 종소리가 딱 한 번 울렸다.'],['bawi','방금 위에서 울렸지? 이 탑에 우리 말고 누가 또 있는 거야.'],
    ['yeoul','종소리가… 꼭 "올라오지 마"라고 하는 것 같았어요.'],['hero','이상하네. 나한텐 "어서 와"로 들렸는데.']],
  [['narr','짙은 안개. 그 너머에서 작은 등불 하나가 흔들리며 이쪽을 내려다본다.'],['hero','…스승님?'],['yeoul','지금 저 불빛, 우리 쪽으로 손짓한 것 같아요.'],
    ['narr','안개가 다시 닫혔다. 저 위로 가는 길은 아직 열리지 않았다. (이야기는 다음에 계속)']],
];
const MEMBERS={
  hero:{name:'나',full:'등불지기',icon:'🏮'},
  yeoul:{name:'여울',full:'치유사 여울',icon:'💧',joinAt:2,joinMsg:'"계단에서 길을 잃었어요… 같이 가도 될까요? 다치면 제가 고쳐 드릴게요."'},
  bawi:{name:'바위',full:'방패꾼 바위',icon:'🪨',joinAt:5,joinMsg:'"그 그림자 등지기를 쓰러뜨렸다고? 좋아, 앞은 내가 막지."'},
};
const vit=()=>1+.1*P('vital');
// 장비: 나는 S.weapon/S.armor, 동료는 S.party[id].weapon/armor. 무기는 주인이 정해져 있고(검·지팡이·방패), 방어구는 누구나.
const NOGEAR={atk:0,def:0,hp:0,r:0,name:'-'};
const gear=(id,slot)=>(id==='hero'?S[slot]:(S.party&&S.party[id]&&S.party[id][slot]))||NOGEAR;
const GW=id=>gear(id,'weapon'),GA=id=>gear(id,'armor');
const WKIND={hero:{k:'무기',stat:'공격'},yeoul:{k:'지팡이',stat:'마력'},bawi:{k:'방패',stat:'공격·방어'}};

const aScore=a=>a.def*4+a.hp;
const ST={
  hero:{hp:()=>maxHp(),mp:()=>maxMp(),atk:()=>atk(),def:()=>def(),spd:()=>10+S.lv*.5,mag:()=>0},

const REGIONS=[

  {n:'그을린 서고',hue:()=>28,deco:'shelf',intro:'타다 만 책 냄새. 책들이 스스로 펄럭이며 길을 막는다.'},

const regionOf=f=>REGIONS[Math.min(REGIONS.length-1,Math.floor((Math.max(1,f)-1)/5))];

const RCOL=['#bbb','#7be38a','#5fb4ff','#d28bff'];

function migrate(s){
  if(!s||typeof s!=='object')return null;
  if(!s.v)s.v=1; // 버전 없던 시절 대비
  if(s.v===1){s.perks={};s.pendingPerks=Math.max(0,(s.lv||1)-1);s.v=2} // v2: 특성 도입 — 이미 오른 레벨만큼 특성 선택권 지급
  if(s.v===2){ // v3: 커맨드 턴제 + 동료. 이미 지나온 층만큼 동료가 합류한 상태로
    s.party={yeoul:{joined:(s.best||0)>=2,hp:null,mp:null},bawi:{joined:(s.best||0)>=5,hp:null,mp:null}};s.v=3}
  if(s.v===3){ // v4: 동료 장비. 지나온 층만큼 동료에게 기본 장비를 맞춰 줌(옛 세이브에서도 동료가 약하지 않게)
    s.party=s.party||{};['yeoul','bawi'].forEach(id=>{const p=s.party[id]=s.party[id]||{joined:false,hp:null,mp:null};const g=starterGear(id,s.best||0);if(!p.weapon)p.weapon=g.weapon;if(!p.armor)p.armor=g.armor});
    s.gearNews=true;s.v=4}
  // 이후 버전이 생기면: if(s.v===4){...; s.v=5;}
  const d=newSave();for(const k in d)if(s[k]===undefined)s[k]=d[k];
  return s;
}

const SPEEDS=[{n:'보통',m:1},{n:'빠르게',m:.6},{n:'아주 빠르게',m:.35}];
const spd=()=>SPEEDS[(S&&S.opt&&S.opt.speed)||0];
const T=ms=>ms*(window.__fast||1)*spd().m; // 연출 시간 배율(쉼터의 '전투 속도' 설정 × 테스트용 배율)
function later(fn,ms){setTimeout(()=>{if(G.mode==='battle'&&G.phase!=='done')fn()},T(ms))}
const liveFoes=()=>foes.filter(e=>e.hp>0);
function startClimb(){G={mode:'battle',floor:S.checkpoint};nextFloor()}
function makeFoe(f,base,boss){
  const ex=Math.max(0,f-5),ex2=Math.max(0,f-10);
  const k=1+.2*(f-1)+.05*ex+.06*ex2,ka=1+.13*(f-1)+.04*ex+.06*ex2;
  const e={...base,boss,name:(boss&&f>15?'되살아난 ':'')+base.name,maxHp:Math.round(base.hp*k*FOE_HP*(boss?1.4:1)),atk:Math.max(2,Math.round(base.atk*ka*FOE_ATK)),def:Math.round(base.def*(1+.1*(f-1))),
    exp:Math.round(base.exp*(1+.25*(f-1))),gold:Math.round(base.gold*(1+.2*(f-1))),spd:(base.spd||(base.fast?12:7))+f*.15,
    dx:0,hit:0,stun:false,acted:false,intent:null};
  e.hp=e.maxHp;e.aiI=boss?0:Math.floor(Math.random()*e.ai.length);return e;
}
const FOE_HP=.85,FOE_ATK=.9; // 파티 전투 보정(밸런스 조정용)
function makeGroup(f){
  const boss=f%5===0;let pool=ENEMIES.filter(e=>f>=e.fl[0]&&f<=e.fl[1]);if(!pool.length)pool=ENEMIES.slice(-3);
  const pick=()=>pool[Math.floor(Math.random()*pool.length)];
  const ps=party().length,list=[];
  if(boss){list.push(makeFoe(f,BOSSES[(f/5-1)%BOSSES.length],true));if(f>=10)list.push(makeFoe(f-3,pick(),false))}
  else{const r=Math.random();let n=f<=2?1:f<=4?(r<.55?1:2):(r<.3?1:r<.75?2:3);n=Math.min(n,ps+(f>=6?1:0));for(let i=0;i<n;i++)list.push(makeFoe(f,pick(),false))}
  // 같은 이름이 둘 이상이면 A·B·C
  const cnt={};list.forEach(e=>cnt[e.name]=(cnt[e.name]||0)+1);const seen={};
  list.forEach(e=>{if(cnt[e.name]>1){seen[e.name]=(seen[e.name]||0)+1;e.name+=' '+'ABC'[seen[e.name]-1]}});
  layoutFoes(list);
  return list;
}
function layoutFoes(list){
  const SL=[[[450,H-80]],[[405,H-62],[515,H-98]],[[385,H-56],[470,H-100],[545,H-52]]][list.length-1];
  list.forEach((e,i)=>{e.x=SL[i][0];e.y=SL[i][1];e.sc=e.boss?1.25:list.length>1?.78:1});
}
function nextFloor(){

function roundStart(){

function orderLine(){return '<span style="color:var(--dim)">순서: '+G.order.filter(o=>o.k==='m'?PM(o.id).hp>0:o.e.hp>0).map(o=>o.k==='m'?`<b style="color:#bfe3ff">${MEMBERS[o.id].name}</b>`:`<span style="color:#ffb0b0">${o.e.name}</span>`).join(' → ')+'</span>'}
function foeLines(){

    const tag=(e.p2?' <span style="color:#ff6a6a">[분노]</span>':'')+(e.fireEat?' <span style="color:#7fd1ff">[🔥흡수·💧약점]</span>':e.weak==='fire'?' <span style="color:#ff9a3c">[🔥약점]</span>':'');

function askCmd(){
  if(G.mode!=='battle')return;

  const acts=[{t:'⚔️ 공격',cls:'main',f:()=>pickFoe(t=>setCmd({a:'atk',t}))}];
  SK[id].filter(s=>S.lv>=(s.lv||1)).forEach(s=>{
    const tag=G.silenced?' 🤐':s.tgt==='ko'&&!koFree().length?' (쓰러진 동료 없음)':s.el==='fire'&&s.id!=='fire3'&&liveFoes().some(e=>e.fireEat)?' ⚠️':'';

  acts.forEach((a,i)=>a.k=(i+1)+(a.k?' · '+a.k:''));
  setActs(acts);
  const fresh=SK[id].filter(s=>s.d&&S.lv>=s.lv&&!(S.seenSk||[]).includes(s.id));
  if(fresh.length){S.seenSk=[...(S.seenSk||[]),...fresh.map(s=>s.id)]}
  G.fresh=G.fresh||{};if(fresh.length)G.fresh[id]=fresh.map(s=>`<b style="color:#8fe7ff">✨ 새 기술 ${s.ic} ${s.n}</b> <span style="color:var(--dim);font-size:12px">— ${s.d} (MP ${s.mp})</span><br>`).join('');const freshMsg=G.fresh[id]||'';
  setMsg(freshMsg+(G.introMsg?G.introMsg+'<hr style="border:0;border-top:1px solid var(--line);margin:6px 0">':'')+foeLines()+(G.silenced?'<br><b style="color:#e0a0ff">🤐 침묵의 장 — 이번 판은 기술을 쓸 수 없다! (공격·방어·회복약만)</b>':'')+'<br>'+orderLine()+`<br>▶ <b style="color:#ffe2a8">${MEMBERS[id].icon} ${MEMBERS[id].name}</b>의 행동은?`);
}
function pickFoe(cb){

// 쓰러졌고, 이번 판 다른 명령이 아직 일으키기로 정하지 않은 동료
const koFree=()=>party().filter(id=>PM(id).hp<=0&&!Object.values(G.cmds).some(c=>(c.a==='revive'||c.a==='pot')&&c.t===id));

function setCmd(c){G.cmds[G.cur]=c;G.inputIdx++;askCmd()}
function execRound(){
  G.phase='act';G.introMsg='';setActs([]);

  for(const id of alive()){const c=G.cmds[id]||{a:'atk'};if(c.a==='guard')G.st[id].guard=true;

    if(c.a==='wall'&&!G.silenced&&PM(id).mp>=6){PM(id).mp-=6;c.paid=1;G.wall=true}}

function step(){

const mpos=id=>POS[id];
function say(h){setMsg(h+'<br>'+orderLine())}
function retarget(t){if(t&&t.hp>0)return t;const L=liveFoes();return L.sort((a,b)=>a.hp-b.hp)[0]}
function memberAct(id,c){

function drawStory(t){
  const J=G.story;if(!J)return;const age=t-J.t0,RG=REGIONS[J.ri],hue=((RG.hue(G.floor||1)%360)+360)%360;
  cx.save();cx.fillStyle='rgba(8,6,14,.78)';cx.fillRect(0,0,W,H);
  const rg=cx.createRadialGradient(W/2,120,10,W/2,120,260);rg.addColorStop(0,`hsla(${hue},70%,60%,.28)`);rg.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=rg;cx.fillRect(0,0,W,H);
  // 꼭대기의 희미한 불빛(떡밥): 지역이 오를수록 조금씩 밝아진다
  const gl=.25+J.ri*.18+Math.sin(t/400)*.08;cx.fillStyle=`rgba(255,214,120,${gl})`;cx.beginPath();cx.arc(W/2,26,5+J.ri*1.5,0,6.28);cx.fill();
  cx.textAlign='center';cx.font='bold 22px sans-serif';cx.lineWidth=5;cx.strokeStyle='#000';
  const head='📜 '+RG.n;cx.strokeText(head,W/2,62);cx.fillStyle='#ffcf6e';cx.fillText(head,W/2,62);
  const who=party().slice().reverse(),xs=who.length===1?[W/2]:who.length===2?[W/2+90,W/2-90]:[W/2+150,W/2,W/2-150];
  const sp=J.line[0];
  who.forEach((w,k)=>{const on=sp===w,sc=1.3*(on?1.05:1);cx.save();cx.globalAlpha=on?1:sp==='narr'?.8:.5;cx.translate(xs[k],H-40);cx.scale(sc,sc);
    if(w==='hero')drawHero(t,0,0,0);else if(w==='yeoul')drawYeoul(t,0,0,0);else drawBawi(t,0,0,0);cx.restore()});
  const txt=J.line[1],n=Math.min(txt.length,Math.floor(age/30)),shown=txt.slice(0,n);
  cx.font=sp==='narr'?'italic 16px sans-serif':'16px sans-serif';
  const bw=sp==='narr'?Math.min(W-60,420):280,rows=[];let cur='';for(const ch of shown){if(cx.measureText(cur+ch).width>bw-24){rows.push(cur);cur=ch}else cur+=ch}rows.push(cur);
  const bh=16+rows.length*22;
  if(sp==='narr'){const bx=W/2,by=96;cx.fillStyle='rgba(30,24,40,.92)';cx.strokeStyle='rgba(255,207,110,.6)';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect?cx.roundRect(bx-bw/2,by,bw,bh,8):cx.rect(bx-bw/2,by,bw,bh);cx.fill();cx.stroke();
    cx.fillStyle='#e8dcc4';cx.textAlign='left';rows.forEach((r,j)=>cx.fillText(r,bx-bw/2+12,by+24+j*22));}
  else{const k=who.indexOf(sp),bx=Math.min(W-150,Math.max(150,xs[k])),by=110;
    cx.fillStyle='rgba(250,244,230,.95)';cx.beginPath();cx.roundRect?cx.roundRect(bx-140,by,280,bh,10):cx.rect(bx-140,by,280,bh);cx.fill();
    cx.beginPath();cx.moveTo(bx-8,by+bh);cx.lineTo(bx+8,by+bh);cx.lineTo(bx,by+bh+12);cx.fill();
    cx.fillStyle='#2a2238';cx.textAlign='left';rows.forEach((r,j)=>cx.fillText(r,bx-128,by+24+j*22));}
  cx.restore();
}
function goNext(){
  if(G.phase!=='afterWin')return; // 두 번 눌림 방지
  G.floor++;const f=G.floor;
  const can=f%5!==0&&(f-1)%5!==0&&G.lastEv!==f-1;
  if(can&&Math.random()<(G.forceEv?1:EVENT_RATE))return floorEvent(G.forceEv);
  nextFloor();
}
function floorEvent(kind){
  const kinds=['chest','chest','merchant','altar'];kind=kind||kinds[Math.floor(Math.random()*kinds.length)];
  G.lastEv=G.floor;foes=[];G.phase='event';
  G.ev={kind,done:false,title:{chest:'낡은 보물상자',merchant:'떠돌이 기름장수',altar:'꺼진 등불 제단'}[kind]};
  S.stats.events=(S.stats.events||0)+1;
  hud();info('');SFX.item();floatText(440,110,'?','#ffcf6e',40);
  ({chest:evChest,merchant:evMerchant,altar:evAltar})[kind]();
}
function evContinue(lines){
  G.phase='evDone';G.ev.done=true;save();hud();
  if(lines)setMsg(lines);
  const go=()=>{if(G.phase!=='evDone')return;G.ev=null;nextFloor()};
  const cont=()=>setActs([{t:`⬆️ ${G.floor}층 계속 오르기`,k:'스페이스',cls:'main wide',f:go}]);
  if(S.pendingPerks>0)perkPick(()=>{G.phase='evDone';if(lines)setMsg(lines);cont()});else cont();
}
function evChest(){
  setMsg(`<b>${G.floor}층</b> 계단참에 <b style="color:#ffcf6e">낡은 보물상자</b>가 있다. 자물쇠는 녹슬었다… 열어 볼까?<br><span style="color:var(--dim)">대부분 좋은 것이 들어 있지만, 가끔 그림자가 숨어 있다.</span>`);
  setActs([
    {t:'🎁 열기',k:'1',cls:'main',f:()=>{
      const r=Math.random(),f=G.floor;G.ev.res='';
      if(r<.15){G.ev.res='trap';const d=Math.max(1,Math.min(Math.ceil(S.hp)-1,Math.round(maxHp()*.15)));S.hp-=d;SFX.hurt();fx.shake=10;ANIM.hero.hit=300;floatText(150,190,'-'+d,'#ff5d6c',30);
        return evContinue(`상자에서 그림자 손이 튀어나와 할퀴었다! <b style="color:#ff5d6c">체력 -${d}</b><br><span style="color:var(--dim)">(함정 상자로는 쓰러지지 않는다)</span>`)}
      burst(440,230,'#ffd257',26);SFX.win();
      if(r<.6){const g=Math.round((10+f*6)*(1+.2*P('luck'))*(.8+Math.random()*.5));S.gold+=g;floatText(440,150,'🪙+'+g,'#ffd257',30);return evContinue(`상자 안에서 반짝이는 동전! <b style="color:#ffd257">🪙 +${g}</b>`)}
      if(r<.85){const n=Math.random()<.3?2:1;S.potions+=n;floatText(440,150,'🧪+'+n,'#7be38a',30);return evContinue(`잘 봉해진 회복약 <b style="color:#7be38a">🧪 +${n}</b>개!`)}
      const it=makeItem(f+1,false);if(it.r<1)it.r=1,it.name=RAR[1].n+it.name.slice(RAR[0].n.length),it.slot==='weapon'?it.atk=Math.round(it.atk*1.35):(it.def=Math.round(it.def*1.35),it.hp=Math.round(it.hp*1.35));
      G.phase='evDone';G.ev.done=true;offerItem(it,()=>{G.phase='evDone';evContinue('상자 속 장비를 챙겼다.')});G.phase='event'}},
    {t:'👣 그냥 지나가기',k:'2',f:()=>evContinue('괜히 건드리지 말자. 상자를 지나쳤다.')},
  ]);
}
function evMerchant(){
  G.ev.bought=G.ev.bought||0;const pp=10,op=12;
  setMsg(`등에 기름통을 멘 <b style="color:#9fffd0">떠돌이 기름장수</b>: "탑 안에선 쉼터보다 싸게 팔지. 대신 두 병까지만."`);
  const full=party().every(id=>PM(id).mp>=ST[id].mp());
  setActs([
    {t:'🧪 회복약',k:`1 · ${pp}🪙 · 남은 ${2-G.ev.bought}`,dis:S.gold<pp||G.ev.bought>=2,f:()=>{S.gold-=pp;S.potions++;G.ev.bought++;SFX.item();floatText(150,190,'🧪+1','#7be38a',26);save();hud();evMerchant()}},
    {t:'🕯️ 등불 기름',k:`2 · ${op}🪙 · 파티 MP 가득`,dis:S.gold<op||full,f:()=>{S.gold-=op;party().forEach(id=>PM(id).mp=ST[id].mp());SFX.heal();floatText(150,190,'MP 가득','#5fb4ff',24);save();hud();evMerchant()}},
    {t:'👋 고마워요, 갈게요',k:'3',cls:'main',f:()=>evContinue('기름장수가 손을 흔든다. "꼭대기에서 보자고."')},
  ]);
}
function evAltar(){
  const f=G.floor,h=Math.round(maxHp()*.35),xp=Math.round(needExp(S.lv)*.35);
  setMsg(`먼지 쌓인 <b style="color:#ffcf6e">꺼진 등불 제단</b>. 손의 등불을 옮겨 붙이면, 불꽃이 무언가를 돌려준다.<br><b>하나만</b> 고를 수 있다.`);
  setActs([
    {t:'❤️ 따뜻함',k:`1 · 파티 체력 35% 회복`,cls:'wide',f:()=>{party().forEach(id=>{const m=PM(id);if(m.hp>0)m.hp=Math.min(ST[id].hp(),m.hp+Math.round(ST[id].hp()*.35))});SFX.heal();burst(150,250,'#7be38a',16);floatText(150,190,'+'+h,'#7be38a',30);evContinue('제단의 불이 몸을 데운다. <b style="color:#7be38a">체력 회복!</b>')}},
    {t:'✨ 깨달음',k:`2 · 경험치 +${xp}`,cls:'wide',f:()=>{S.exp+=xp;SFX.lv();burst(440,200,'#ffd257',20);floatText(150,150,'EXP +'+xp,'#ffd257',26);const u=levelCheck();evContinue(`불꽃 속에 옛 등불지기의 기억이 비친다. <b style="color:#ffd257">경험치 +${xp}</b>`+(u?`<br><b style="color:#ffd257">레벨 업! Lv${S.lv}</b>`:''))}},
    {t:'🔥 불씨',k:'3 · 나의 다음 공격 ×1.5',cls:'wide',f:()=>{G.ember=1;SFX.fire();burst(150,230,'#ff9a3c',18);evContinue('손의 등불에 붉은 불씨가 옮겨 붙었다. <b style="color:#ff9a3c">다음 한 방이 1.5배!</b>')}},
  ]);
}
function makeItem(f,boss){
  let r=0;const x=Math.random()+(boss?.5:0)+f*.015;
  if(x>1.35)r=3;else if(x>1.05)r=2;else if(x>.7)r=1;
  const L=party();const weapon=Math.random()<.55;const p=Math.max(1,Math.round((1+f*.55)*RAR[r].m));
  if(weapon){const who=L[Math.floor(Math.random()*L.length)];const N=WN[who];
    return{slot:'weapon',who,name:RAR[r].n+' '+N[Math.min(N.length-1,Math.floor(f/3))],atk:p,r}}
  return{slot:'armor',name:RAR[r].n+' '+ANAMES[Math.min(ANAMES.length-1,Math.floor(f/4))],def:Math.max(0,Math.round(p*.6)),hp:p*3,r};
}
function equipTo(id,it){const g={name:it.name,atk:it.atk||0,def:it.def||0,hp:it.hp||0,r:it.r};
  if(id==='hero')S[it.slot]=g;else S.party[id][it.slot]=g;
  const m=PM(id);m.hp=Math.min(ST[id].hp(),m.hp==null?ST[id].hp():m.hp);
  const p=mpos(id);floatText(p[0],p[1]-110,'장착!','#ffd257',20);burst(p[0],p[1]-50,'#ffd257',12)}
function offerItem(it,done=afterWin){
  SFX.item();G.phase='item';
  const price=Math.round(5+(it.atk||it.def*2+it.hp/3)*2*RAR[it.r].m);
  const sell={t:`팔기 (+${price}🪙)`,f:()=>{S.gold+=price;save();hud();done()}};
  const head=`🎁 <b>장비 발견!</b> <span class="${RAR[it.r].c}">${it.name}</span>`;
  if(it.slot==='weapon'){
    const id=it.who||'hero',cur=GW(id),better=it.atk>cur.atk;
    info(`${head} <span style="color:var(--dim)">— ${MEMBERS[id].icon} ${MEMBERS[id].name} 전용 ${WKIND[id].k}</span><br>${wDesc(id,it.atk)} (지금 ${wDesc(id,cur.atk)}) ${better?'<b style="color:#7be38a">▲ 더 좋음</b>':'<span style="color:#a99fba">▼ 지금 것이 나음</span>'}`);
    setActs([{t:`${MEMBERS[id].icon} ${MEMBERS[id].name}에게 장착`,cls:better?'main':'',f:()=>{equipTo(id,it);SFX.item();save();hud();done()}},{...sell,cls:better?'':'main'}]);
    return;
  }
  // 방어구: 누구에게 줄지 고른다
  const L=party();const gain=id=>aScore(it)-aScore(GA(id));const bestId=L.slice().sort((a,b)=>gain(b)-gain(a))[0];
  info(`${head} <span style="color:var(--dim)">— 방어구 (누구나)</span><br>방어 +${it.def}, 체력 +${it.hp}<br>${L.map(id=>{const c=GA(id),g=gain(id);return `${MEMBERS[id].icon} ${MEMBERS[id].name}: 지금 방어 +${c.def}·체력 +${c.hp} ${g>0?'<b style="color:#7be38a">▲</b>':'<span style="color:#a99fba">▼</span>'}`}).join('<br>')}`);
  setActs([...L.map(id=>{const g=gain(id);return{t:`${MEMBERS[id].icon} ${MEMBERS[id].name}에게`,k:g>0?'▲ 더 좋음':'▼ 지금 것이 나음',cls:(g>0&&id===bestId)?'main':'',f:()=>{equipTo(id,it);SFX.item();save();hud();done()}}}),{...sell,cls:gain(bestId)>0?'':'main'}]);
}
function lose(){
  if(G.phase==='done')return;G.phase='done';S.stats.deaths++;
  const lost=Math.floor(S.gold*.3);S.gold-=lost;restoreAll();save();
  fx.flash=.5;
  setMsg(`파티가 모두 쓰러졌다… 등불이 흔들리더니 꺼졌다. 정신을 차려 보니 쉼터. (🪙 ${lost} 잃음)<br>경험치와 장비는 그대로! 강해져서 다시 가자.`);
  setActs([{t:'쉼터로',cls:'main wide',f:()=>town()}]);
}

// ================= 입력 =================
$('stage').addEventListener('pointerdown',e=>{e.preventDefault();au();
  if(G.mode==='battle'&&G.phase==='target'&&G.pickCb){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
    let best=null,bd=1e9;for(const f of liveFoes()){const d=Math.hypot(f.x-x,(f.y-60*f.sc)-y);if(d<bd){bd=d;best=f}}if(best&&bd<90)G.pickCb(best)}});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();
    if(G.phase==='perk')return;const b=curActs.find(a=>!a.dis);if(b)b.f();return}
  const i=+e.key-1;if(i>=0&&i<9){const b=curActs[i];if(G.phase==='perk'&&G.perkChoices){if(G.perkChoices[i])G.perkPickFn(G.perkChoices[i]);return}if(b&&!b.dis)b.f()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save()});

// 테스트용 훅
window.__game={storyScene,STORY,floorEvent,goNext,joinScene,offerItem,makeItem,forge,town,ST,get curActs(){return curActs},PERKS,perkPick,get S(){return S},get G(){return G},get foes(){return foes},newSave,migrate,SAVE_KEY};
title();requestAnimationFrame(loop);
</script>
